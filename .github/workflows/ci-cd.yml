name: ARNIX Research & Validation Engine — CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: 🛡️ Code Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências do Forms
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest httpx

      - name: Validar Sintaxe & Compilação Python
        run: |
          python -m py_compile backend/server.py
          python -m py_compile backend/db.py
          python -m py_compile api/index.py

      - name: Executar Teste Funcional dos Endpoints & Segurança
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); from fastapi.testclient import TestClient; from server import app; client = TestClient(app); assert client.get('/').status_code == 200; assert client.get('/dashboard').status_code == 200; assert client.get('/sobre').status_code == 200; assert client.get('/fundador').status_code == 200; assert client.get('/api/metricas').status_code == 401, 'Deveria bloquear sem token'; assert client.get('/api/metricas', headers={'x-admin-key': 'Prattes@Arnix2026!Master'}).status_code == 200, 'Deveria permitir com token admin'; print('[OK] Todos os endpoints do forms responderam e a segurança está 100% ativa!')"

  deploy-check:
    name: 🚀 Vercel & Production Verification
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Verificar Estrutura para Deploy Vercel
        run: |
          test -f vercel.json && echo "[OK] vercel.json presente"
          test -f frontend/index.html && echo "[OK] frontend/index.html presente"
          test -f frontend/dashboard.html && echo "[OK] frontend/dashboard.html presente"
          test -f frontend/sobre.html && echo "[OK] frontend/sobre.html presente"
          test -f frontend/fundador.html && echo "[OK] frontend/fundador.html presente"
          test -f backend/server.py && echo "[OK] backend/server.py presente"
          test -f api/index.py && echo "[OK] api/index.py presente"
          echo "========================================================"
          echo " ✅ ARNIX RESEARCH SYSTEM — 100% PRONTO PARA PRODUÇÃO"
          echo " 🏢 Empresa: Prattes Technologies"
          echo " 🌐 Domínio: orbb.com.br / arnix-forms.orbb.com.br"
          echo "========================================================"
